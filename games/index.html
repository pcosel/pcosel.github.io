<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games — pcosel</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/overview.css">
  <link rel="stylesheet" href="../css/detail.css">
  <script src="../js/theme-toggle.js" defer></script>
  <script src="../js/gallery.js" defer></script>
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="../index.html" class="nav-brand">pcosel</a>
      <div class="nav-links">
        <a href="./" class="nav-link active">Games</a>
        <label class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <input type="checkbox" class="theme-toggle__input" id="themeToggleInput">
          <span class="theme-toggle__track">
            <span class="theme-toggle__icon" aria-hidden="true">
              <svg class="theme-toggle__icon--sun" viewBox="0 -960 960 960"><path d="M338.5-338.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/></svg>
              <svg class="theme-toggle__icon--moon" viewBox="0 -960 960 960"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/></svg>
            </span>
            <span class="theme-toggle__knob"></span>
          </span>
        </label>
      </div>
    </div>
  </nav>
  <main>
    <section id="overview">
      <h1>Games</h1>
      <div id="games-list" class="games-list"></div>
      <p id="empty-state" class="empty-state" style="display:none;">No games yet.</p>
    </section>
    <section id="detail" style="display:none;">
      <button class="back-link" id="backToOverview">← Back to all games</button>
      <div id="detail-content"></div>
    </section>
  </main>
  <script>
    (function () {
      const placeholder = "../assets/placeholder.svg";

      function getCurrentSlug() {
        return new URLSearchParams(window.location.search).get("game");
      }

      function renderOverview(games) {
        const list = document.getElementById("games-list");
        const empty = document.getElementById("empty-state");
        const overview = document.getElementById("overview");
        const detail = document.getElementById("detail");

        detail.style.display = "none";
        overview.style.display = "block";

        if (!games.length) {
          list.innerHTML = "";
          empty.style.display = "block";
          return;
        }

        empty.style.display = "none";

        const sorted = games.slice().sort(function (a, b) {
          return new Date(b.date) - new Date(a.date);
        });

        list.innerHTML = sorted.map(function (game) {
          return '<a href="?game=' + encodeURIComponent(game.slug) + '" class="game-card">' +
            '<img src="../' + (game.coverImage || placeholder) + '" alt="Cover for ' + game.name + '" onerror="this.src=\'' + placeholder + '\'">' +
            '<div class="card-info">' +
            '<h2>' + game.name + '</h2>' +
            '<p class="card-desc">' + game.shortDescription + '</p>' +
            '<p class="card-meta">' + renderJamOrDate(game, false) + '</p>' +
            '</div>' +
            '</a>';
        }).join("");
      }

      function renderJamOrDate(game, asLink) {
        if (game.jam && game.jam.name) {
          if (asLink) {
            return '<a href="' + game.jam.url + '" target="_blank" rel="noopener">' + game.jam.name + '</a> · ' + formatDate(game.date);
          }
          return game.jam.name + ' · ' + formatDate(game.date);
        }
        return formatDate(game.date);
      }

      function formatDate(dateStr) {
        var parts = dateStr.split("-");
        var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
        return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
      }

      function renderDetail(game) {
        var overview = document.getElementById("overview");
        var detail = document.getElementById("detail");
        var content = document.getElementById("detail-content");

        overview.style.display = "none";
        detail.style.display = "block";

        var html = '<div class="detail-header">\n';
        html += '  <h1>' + game.name + '</h1>\n';
        html += '  <p class="detail-meta">' + renderJamOrDate(game, true) + '</p>\n';
        html += '</div>\n';
        html += '<div class="detail-description">' + game.description + '</div>\n';

        if (game.screenshots && game.screenshots.length) {
          html += renderGallery(game.screenshots);
        }

        html += '<div class="detail-actions">\n';
        if (game.playUrl) {
          html += '  <a href="' + game.playUrl + '" target="_blank" rel="noopener" class="btn btn-primary">Play on Itch.io</a>\n';
        }
        if (game.downloadUrl) {
          html += '  <a href="' + game.downloadUrl + '" target="_blank" rel="noopener" class="btn btn-secondary">Download</a>\n';
        }
        html += '</div>\n';

        content.innerHTML = html;

        initGallery(game.screenshots || []);

        window.scrollTo(0, 0);
      }

      function renderGallery(screenshots) {
        var html = '<div class="gallery" id="gallery">\n';
        html += '  <div class="gallery-main">\n';
        html += '    <button class="gallery-arrow gallery-arrow--left" id="arrowLeft" aria-label="Previous image">‹</button>\n';
        html += '    <img id="mainImage" src="../' + screenshots[0] + '" alt="Screenshot" onerror="this.src=\'' + placeholder + '\'">\n';
        html += '    <button class="gallery-arrow gallery-arrow--right" id="arrowRight" aria-label="Next image">›</button>\n';
        html += '  </div>\n';
        html += '  <div class="gallery-thumbs" id="thumbs">\n';
        screenshots.forEach(function (src, i) {
          html += '    <button class="thumb' + (i === 0 ? " thumb--active" : '') + '" data-index="' + i + '" aria-label="Show screenshot ' + (i + 1) + '">\n';
          html += '      <img src="../' + src + '" alt="Thumbnail ' + (i + 1) + '" onerror="this.src=\'' + placeholder + '\'">\n';
          html += '    </button>\n';
        });
        html += '  </div>\n';
        html += '</div>\n';
        return html;
      }

      function initGallery(screenshots) {
        if (!screenshots.length) return;

        var currentIndex = 0;
        var mainImage = document.getElementById("mainImage");
        var arrowLeft = document.getElementById("arrowLeft");
        var arrowRight = document.getElementById("arrowRight");
        var thumbs = document.querySelectorAll(".thumb");

        function update() {
          if (mainImage) mainImage.src = "../" + screenshots[currentIndex];
          if (arrowLeft) arrowLeft.style.display = currentIndex === 0 ? "none" : "";
          if (arrowRight) arrowRight.style.display = currentIndex === screenshots.length - 1 ? "none" : "";
          thumbs.forEach(function (t, i) {
            t.classList.toggle("thumb--active", i === currentIndex);
          });
        }

        if (arrowLeft) {
          arrowLeft.addEventListener("click", function () {
            if (currentIndex > 0) {
              currentIndex--;
              update();
            }
          });
        }

        if (arrowRight) {
          arrowRight.addEventListener("click", function () {
            if (currentIndex < screenshots.length - 1) {
              currentIndex++;
              update();
            }
          });
        }

        thumbs.forEach(function (thumb) {
          thumb.addEventListener("click", function () {
            currentIndex = parseInt(thumb.getAttribute("data-index"), 10);
            update();
          });
        });

        if (screenshots.length === 1) {
          if (arrowLeft) arrowLeft.style.display = "none";
          if (arrowRight) arrowRight.style.display = "none";
        }

        update();
      }

      function showNotFound() {
        document.getElementById("overview").style.display = "none";
        var detail = document.getElementById("detail");
        detail.style.display = "block";
        document.getElementById("detail-content").innerHTML =
          '<p class="not-found">Game not found.</p><p><a href="./" class="back-link">← Back to all games</a></p>';
      }

      function setupBackButton() {
        var btn = document.getElementById("backToOverview");
        if (btn) btn.addEventListener("click", function (e) {
          e.preventDefault();
          window.history.pushState({}, "", window.location.pathname);
          fetchGames();
        });
      }

      function fetchGames() {
        fetch("../data/games.json")
          .then(function (res) { return res.json(); })
          .then(function (data) {
            var games = data.games || [];
            var slug = getCurrentSlug();

            if (slug) {
              var game = games.find(function (g) { return g.slug === slug; });
              if (game) {
                renderDetail(game);
              } else {
                showNotFound();
              }
            } else {
              renderOverview(games);
            }
          })
          .catch(function () {
            document.getElementById("overview").style.display = "block";
            document.getElementById("games-list").innerHTML = "<p>Failed to load games data.</p>";
          });
      }

      setupBackButton();
      fetchGames();

      window.addEventListener("popstate", function () {
        fetchGames();
      });
    })();
  </script>
</body>
</html>
